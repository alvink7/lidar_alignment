# cloud_aligner parameters
#
reference_pcd: "~/catkin_ws/maps/reference_jul1.pcd"

# ---- topics & I/O ----
input_topic: "/cloud_registered"
output_topic: "/target_to_reference"
matrix_topic: "/target_to_reference_matrix"

# ---- frame names ----
reference_frame: "reference_map"
# target_frame: ""   # leave unset to read from incoming message header

# ---- accumulation ----
# Number of incoming frames to merge before aligning once. 120 is a generally good baseline for indoor and outdoor, but tune as needed.
num_frames: 120

# ---- publish gate ----
# Refuse to publish a transform that fails these. Generally, these will not have to change.
min_coverage: 0.50        # 0.0 disables the gate
max_rmse_m: 0.50          # deliberately loose; coverage does the real work

# ---- pipeline tuning ----
# MUST change this according to your scene descriptions. If geometry is small and concentrated tune downwards. For indoor alignment, ~0.12 was a good estimate.
# For outdoor alignment, ~0.75 is a good estimate.
GLOBAL_VOXEL: 0.75        

# ---- multi-scale sweep, voxels chosen automatically from the data ----
GLOBAL_SWEEP: true

# How the ladder is chosen. You generally will not have to change these.
GLOBAL_VOXELS: []
GLOBAL_TARGET_POINTS: 12000
GLOBAL_AUTO_FACTORS: [0.7, 0.85, 1.0, 1.2, 1.45]
GLOBAL_MAX_POINTS: 200000     
GLOBAL_MAX_TILT_DEG: 20.0     # discard candidates tilted more than this (both clouds are gravity-aligned, but this is a precaution)

# Gaining consensus between sweep runs of different voxel sizes.
CONSENSUS_ROT_DEG: 5.0
CONSENSUS_TRANS_FACTOR: 2.5
CONSENSUS_MIN_AGREE: 2        # scales that must agree to trust the answer
require_consensus: true       # refuse to publish if fewer scales agree

# ---- static TF broadcast ----
# Broadcasts reference_frame -> odom_parent_frame so FAST-LIO's odometry composes into the reference frame via TF. Set false to publish topics only.
broadcast_tf: true
# FAST-LIO's odometry parent frame (its camera_init / odom frame name).
odom_parent_frame: "camera_init"
